<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · OpenRouter Chat</title>
<meta name="description" content="Nexus Chat mit offiziellen Fluent UI SVG Icons.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<style>
  :root{color-scheme:dark;--bg:#1f1f1f;--panel:#252423;--text:#f3f2f1;--muted:#a19f9d;--accent:#0078d4;--border:#3b3a39}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .boot{position:fixed;right:16px;bottom:16px;z-index:10;max-width:min(420px,calc(100% - 32px));padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:rgba(37,36,35,.94);box-shadow:0 18px 45px rgba(0,0,0,.35);font-size:13px;line-height:1.45;color:var(--muted);transition:opacity .25s ease}
  .boot strong{display:block;margin-bottom:3px;color:var(--text)}
  .boot.ok{border-color:rgba(0,120,212,.55)}
  .boot.error{border-color:rgba(209,52,56,.72)}
</style>
</head>
<body>
<iframe id="nexus-frame" src="nexus-chat-core.html" title="Nexus Chat"></iframe>
<div class="boot" id="boot"><strong>Nexus</strong>Offizielle Fluent UI SVG Icons werden vorbereitet…</div>
<script>
const frame = document.getElementById('nexus-frame');
const boot = document.getElementById('boot');

function setBoot(message, state){
  boot.innerHTML = '<strong>Nexus</strong>' + message;
  boot.className = 'boot ' + (state || '');
  if (state === 'ok') setTimeout(() => { boot.style.opacity = '0'; boot.style.pointerEvents = 'none'; }, 2200);
}

frame.addEventListener('load', () => {
  try {
    const doc = frame.contentDocument;
    if (!doc) throw new Error('Kein Zugriff auf das Nexus Dokument.');
    const script = doc.createElement('script');
    script.src = new URL('nexus-icons-inline.js', window.location.href).href;
    script.onload = () => setBoot('Offizielle Fluent UI SVG Icons aktiv.', 'ok');
    script.onerror = () => setBoot('Icon Script konnte nicht geladen werden.', 'error');
    doc.body.appendChild(script);
  } catch (error) {
    console.error(error);
    setBoot('Icon Fix konnte nicht geladen werden: ' + (error.message || error), 'error');
  }
});
</script>
</body>
</html>
